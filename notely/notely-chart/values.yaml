#---------flask---------
flask:
  replicaCount: 1
  kind: Deployment
  metadata:
    name: notely-flask
    namespace: notely
  appName: notely-flask
  containerName: notely-flask
  image:
    # ECR (rollback): uncomment the ECR repository and remove/comment the jfrog
    # repository + pullSecrets to switch back.
    # repository: 533813050020.dkr.ecr.us-east-1.amazonaws.com/idan/notely-back
    repository: idandev.jfrog.io/notely-docker-local-docker-local/idan/notely-back
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: jfrog-pull-secret
  ports:
    protocol: TCP
    port: 5001
    targetPort: 5001
  resources:
    requests:
      memory: "32Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
  env:
    - name: MONGO_SECRET_NAME
      value: "idan_notely_secrets"
    - name: AWS_REGION
      value: "us-east-1"
    # Entra ID SSO (public identifiers, not secrets)
    - name: ENTRA_TENANT_ID
      value: "504483c6-ab3b-408a-b4d3-152fa58976df"
    - name: ENTRA_CLIENT_ID
      value: "9c775da3-1c31-4ab4-9940-76d45b7d9a71"
  serviceType: ClusterIP
  serviceAccount:
    name: notely-secret-manager
    roleArn: arn:aws:iam::533813050020:role/idan-eks-secret-manager-role
    environment: production
    automountServiceAccountToken: true

#--------------nginx----------------
nginx:
  replicaCount: 1
  kind: Deployment
  metadata:
    name: notely-nginx
    namespace: notely
  appName: notely-nginx
  containerName: notely-nginx
  image:
    # ECR (rollback): uncomment the ECR repository and remove/comment the jfrog
    # repository + pullSecrets to switch back.
    # repository: 533813050020.dkr.ecr.us-east-1.amazonaws.com/idan/notely-front
    repository: idandev.jfrog.io/notely-docker-local-docker-local/idan/notely-front
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: jfrog-pull-secret
  ports:
      protocol: TCP
      port: 3000
      targetPort: 80
  resources:
    requests:
      memory: "32Mi"
      cpu: "250m"
    limits:
      memory: "32Mi"
      cpu: "250m"
  serviceType: ClusterIP

#---------- Ingress ----------
ingress:
  serviceName: notely-ingress
  nameSpace: notely
  enabled: true
  className: nginx

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  nginxRules:
    - host: notely.ddns.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notely-nginx
                port:
                  number: 3000
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: notely-flask
                port:
                  number: 5001
          - path: /notes
            pathType: Prefix
            backend:
              service:
                name: notely-flask
                port:
                  number: 5001
  tls:
    - secretName: notely-tls
      hosts:
        - notely.ddns.net

#-------------mongodb--------------
mongodb:
  # Broadcom removed versioned tags from docker.io/bitnami/* (late 2025);
  # the archived copies live under bitnamilegacy/* (frozen, no updates).
  image:
    repository: bitnamilegacy/mongodb
    tag: 8.0.4-debian-12-r0
  global:
    storageClass: ebs-sc
    security:
      # Required by the Bitnami chart to accept a non-"bitnami/" repository
      # (bitnamilegacy is Broadcom's own archive of the same images).
      allowInsecureImages: true
  labels:
    app: mongodb
  architecture: replicaset

  auth:
    enabled: true
    rootUser: root
    # Passwords come from the Terraform-managed secret (keys: mongodb-root-password,
    # mongodb-passwords, mongodb-replica-set-key) — never commit credentials here.
    existingSecret: notely-mongodb-auth
    databases: [flask-notely]
    usernames: ["admin"]

  replicaCount: 1

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  systemLogVerbosity: 3

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 500Mi

  arbiter:
    enabled: false

#-------------clusterIssuer--------------
clusterIssuer:
  metaDataName: letsencrypt-prod
  server: https://acme-v02.api.letsencrypt.org/directory
  email: idancohen55@gmail.com
  privateKeySecretRef: letsencrypt-prod-key
  solversClass: nginx
